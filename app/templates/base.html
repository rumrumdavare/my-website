<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>{% block title %}Ramani Davare{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/static/css/styles.css" rel="stylesheet" />
</head>
<body>
    <header class="site-header">
        <div class="container header-inner">
            <div class="logo">
                <a href="/">Ramani Davare</a>
            </div>
            <nav class="nav">
                <a href="/" class="{% if page == 'home' %}active{% endif %}">Home</a>
                <a href="/cv" class="{% if page == 'cv' %}active{% endif %}">CV</a>
                <a href="/portfolio" class="{% if page == 'portfolio' %}active{% endif %}">Portfolio</a>
                <a href="/blog" class="{% if page == 'blog' %}active{% endif %}">Blog</a>
                <a href="/contact" class="{% if page == 'contact' %}active{% endif %}">Contact</a>
            </nav>
        </div>
    </header>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>© 2025 Ramani Davare · 
                <a href="www.linkedin.com/in/ramani-davare" target="_blank">LinkedIn</a> · 
                <a href="https://github.com/rumrumdavare" target="_blank">GitHub</a>
            </p>
        </div>
    </footer>
</body>
</html>
